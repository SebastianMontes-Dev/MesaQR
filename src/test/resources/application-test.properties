# ===== Perfil de testing =====
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

restaurant.name=Test Restaurante
restaurant.iva.habilitado=true
restaurant.iva.porcentaje=16
restaurant.propina.habilitada=false
restaurant.propina.porcentaje=10
restaurant.qr.tamanio=200
restaurant.token.duracion-horas=24
restaurant.retry.max-intentos=3
restaurant.retry.delay-ms=10
restaurant.webhook.secret=test_secret
restaurant.cors.allowed-origins=http://localhost:8080

management.endpoints.web.exposure.include=health

resilience4j.ratelimiter.instances.pago.limit-for-period=100
resilience4j.ratelimiter.instances.pago.limit-refresh-period=1s
resilience4j.ratelimiter.instances.pago.timeout-duration=0s
resilience4j.ratelimiter.instances.pedido.limit-for-period=100
resilience4j.ratelimiter.instances.pedido.limit-refresh-period=1s
resilience4j.ratelimiter.instances.pedido.timeout-duration=0s
