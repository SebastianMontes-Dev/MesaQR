<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${nombreRestaurante}">Restaurante</title>
    <link rel="stylesheet" th:href="@{/css/menu.css}" />
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2/lib/stomp.min.js"></script>
</head>
<body>
    <script th:if="${tokenFaltante}">
        (function() {
            var hash = window.location.hash;
            if (hash && hash.indexOf('token=') !== -1) {
                var tokenVal = hash.substring(hash.indexOf('token=') + 6);
                document.cookie = "session_token=" + tokenVal + "; path=/; max-age=86400";
                window.location.reload();
            }
        })();
    </script>

    <div class="contenedor" th:if="${tokenFaltante}">
        <div class="encabezado">
            <h1 th:text="${nombreRestaurante}">Mi Restaurante</h1>
            <div class="info-mesa">Mesa <span th:text="${mesaId}">-</span></div>
        </div>
        <div class="estado-vacio">Escanea el código QR de tu mesa para comenzar.</div>
        <div class="seccion-menu">
            <div class="titulo-seccion">Menú</div>
            <div class="grilla-menu">
                <div th:each="platillo : ${platillos}" class="elemento-menu">
                    <div>
                        <div class="nombre-platillo" th:text="${platillo.nombre}"></div>
                        <div class="categoria-platillo" th:text="${platillo.categoria}"></div>
                    </div>
                    <div class="precio-platillo" th:text="'$' + ${#numbers.formatDecimal(platillo.precio, 0, 'COMMA', 3, 'POINT')}"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="contenedor" th:if="${pedidoPagado}">
        <div class="encabezado">
            <h1 th:text="${nombreRestaurante}">Mi Restaurante</h1>
            <div class="info-mesa">Mesa <span th:text="${mesaId}">-</span></div>
        </div>
        <div class="estado-vacio" th:text="${mensajeError}"></div>
    </div>

    <div class="contenedor" th:if="${!pedidoPagado and !tokenFaltante}">
        <div class="encabezado">
            <h1 th:text="${nombreRestaurante}">Mi Restaurante</h1>
            <div class="info-mesa">Mesa <span th:text="${resumen.numeroDeMesa}">-</span></div>
            <span class="badge-estado" th:classappend="'estado-' + ${resumen.estado}" th:text="${resumen.estado}">ABIERTO</span>
        </div>

        <div class="titulo-seccion">Tu pedido</div>
        <div th:if="${resumen.detalles.isEmpty()}">
            <div class="estado-vacio">No hay elementos en tu pedido todavía. Agrega algo del menú.</div>
        </div>
        <div th:each="detalle : ${resumen.detalles}" class="elemento-pedido">
            <div class="izquierda">
                <div class="nombre" th:text="${detalle.cantidad} + 'x ' + ${detalle.nombrePlatillo}"></div>
                <div class="detalles" th:if="${detalle.notas}" th:text="${detalle.notas}"></div>
            </div>
            <div class="derecha">
                <div class="sub-total" th:text="'$' + ${#numbers.formatDecimal(detalle.subTotal, 0, 'COMMA', 3, 'POINT')}">$0</div>
            </div>
        </div>

        <div class="barra-total">
            <div class="linea-desglose">
                <span>Subtotal</span>
                <span th:text="'$' + ${#numbers.formatDecimal(resumen.subtotal, 0, 'COMMA', 3, 'POINT')}">$0</span>
            </div>
            <div class="linea-desglose" th:if="${resumen.iva != null and resumen.iva.compareTo(T(java.math.BigDecimal).ZERO) > 0}">
                <span>IVA (16%)</span>
                <span th:text="'$' + ${#numbers.formatDecimal(resumen.iva, 0, 'COMMA', 3, 'POINT')}">$0</span>
            </div>
            <div class="linea-desglose" th:if="${resumen.propina != null and resumen.propina.compareTo(T(java.math.BigDecimal).ZERO) > 0}">
                <span>Propina (10%)</span>
                <span th:text="'$' + ${#numbers.formatDecimal(resumen.propina, 0, 'COMMA', 3, 'POINT')}">$0</span>
            </div>
            <div class="linea-desglose total-final">
                <span>TOTAL</span>
                <span class="monto" th:text="'$' + ${#numbers.formatDecimal(resumen.total, 0, 'COMMA', 3, 'POINT')}">$0</span>
            </div>
        </div>

        <div class="seccion-pago" th:if="${!resumen.detalles.isEmpty()}">
            <div class="titulo-seccion">Pagar con</div>
            <div class="grilla-pago">
                <button class="btn-pago" onclick="pagar('TARJETA')">Tarjeta</button>
                <button class="btn-pago" onclick="pagar('TRANSFERENCIA_QR')">QR Bancario</button>
                <button class="btn-pago" onclick="pagar('EFECTIVO')">Efectivo</button>
            </div>
            <button class="btn-cancelar" onclick="cancelarPedido()">Cancelar pedido</button>
        </div>

        <div class="seccion-menu">
            <div class="titulo-seccion">Menú</div>
            <div class="grilla-menu">
                <div th:each="platillo : ${platillos}" class="elemento-menu"
                     th:data-platillo-id="${platillo.id}" th:data-platillo-nombre="${platillo.nombre}"
                      onclick="agregarElemento(parseInt(this.dataset.platilloId), this.dataset.platilloNombre)">
                    <div>
                        <div class="nombre-platillo" th:text="${platillo.nombre}"></div>
                        <div class="categoria-platillo" th:text="${platillo.categoria}"></div>
                    </div>
                    <div class="precio-platillo" th:text="'$' + ${#numbers.formatDecimal(platillo.precio, 0, 'COMMA', 3, 'POINT')}"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="notificacion" id="notificacion"></div>

    <script th:inline="javascript">
        const mesaId = [[${mesaId}]];
        const token = '[[${token}]]';
    </script>
    <script th:src="@{/js/menu.js}"></script>
</body>
</html>
