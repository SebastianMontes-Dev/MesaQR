# ===== Perfil de producción =====

# Base de datos (todas las credenciales desde variables de entorno)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:restaurant_db}
spring.datasource.username=${DB_USER:restaurant}
spring.datasource.password=${DB_PASSWORD}

# Logging reducido
logging.level.com.restaurant=INFO
logging.level.org.springframework.web=WARN

# JPA optimizado
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=false

# Actuator: solo health y prometheus en producción
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized

# Webhook
restaurant.webhook.secret=${WEBHOOK_SECRET}

# Seguridad
server.forward-headers-strategy=framework
