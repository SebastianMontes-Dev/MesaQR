# ===== Perfil de desarrollo =====

# Base de datos local
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant_db
spring.datasource.username=restaurant
spring.datasource.password=restaurant

# Logging detallado
logging.level.com.restaurant=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Actuator: exponer todos los endpoints en dev
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# CORS permisivo en desarrollo
restaurant.cors.allowed-origins=http://localhost:8080,http://localhost:3000,http://localhost:5173
